name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            configuration: phpunit.xml
          - database: pgsql
            configuration: phpunit.pgsql.xml

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vehicle_maintenance_test
          POSTGRES_USER: vehicle
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vehicle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # imagick ao lado do gd: MaintenancePhotoImageProcessor tem um caminho para cada um e,
          # sem a extensão aqui, os catorze casos do driver imagick pulavam sem derrubar o job.
          extensions: pdo_sqlite, pdo_pgsql, mbstring, bcmath, gd, imagick, zip, exif, intl, fileinfo
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Blade views render Vite assets, so the manifest must exist before the suite runs.
      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # PHPUnit directly, not `artisan test`: that command always appends its own
      # --configuration=phpunit.xml, and the duplicate option makes PHPUnit exit 1
      # even when every test passes.
      - name: Run tests
        run: vendor/bin/phpunit --configuration=${{ matrix.configuration }}
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432

  code-style:
    name: Pint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style
        run: vendor/bin/pint --test
