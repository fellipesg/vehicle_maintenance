# Local runtime (mirrors prod: PHP 8.4 + Postgres + database queue, no Redis).
# Container env below overrides the matching keys in .env, so .env can stay on
# sqlite for anything run outside Docker.
#
# Host overrides (shell env): APP_PORT (8080), FORWARD_DB_PORT (5433),
# XDEBUG_MODE (off), WWWUSER/WWWGROUP (1000, Linux only).

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
    args:
      WWWUSER: ${WWWUSER:-1000}
      WWWGROUP: ${WWWGROUP:-1000}
  image: vehicle_maintenance-app
  restart: unless-stopped
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  networks:
    - vehicle_maintenance_network
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy
  environment:
    APP_URL: http://localhost:${APP_PORT:-8080}
    DB_CONNECTION: pgsql
    DB_URL: ""
    DB_HOST: db
    DB_PORT: 5432
    DB_DATABASE: vehicle_maintenance
    DB_USERNAME: vehicle
    DB_PASSWORD: secret
    DB_SSLMODE: disable
    XDEBUG_MODE: ${XDEBUG_MODE:-off}
    # No EC2 metadata endpoint locally; without this the AWS SDK retries IMDS
    # with multi-second sleeps whenever an S3/R2 disk has no keys.
    AWS_EC2_METADATA_DISABLED: "true"

services:
  db:
    image: postgres:17-alpine
    container_name: vehicle_maintenance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vehicle_maintenance
      POSTGRES_USER: vehicle
      POSTGRES_PASSWORD: secret
    ports:
      - "${FORWARD_DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - vehicle_maintenance_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicle -d vehicle_maintenance"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    <<: *app
    container_name: vehicle_maintenance_app
    command: php-fpm

  queue:
    <<: *app
    container_name: vehicle_maintenance_queue
    command: php artisan queue:work database --timeout=300 --tries=2 --sleep=3

  scheduler:
    <<: *app
    container_name: vehicle_maintenance_scheduler
    command: php artisan schedule:work

  # Vite dev server / asset build (Vite 7 needs Node 20.19+). Not started by
  # `up`; use `make dev` / `make build`. node_modules lives in a volume so the
  # host's macOS-native binaries never clash with the Linux ones.
  node:
    image: node:22-alpine
    container_name: vehicle_maintenance_node
    profiles: ["frontend"]
    init: true
    user: node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    environment:
      # Makes laravel-vite-plugin listen on 0.0.0.0 but write
      # http://localhost:5173 to public/hot for the browser.
      LARAVEL_SAIL: "1"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev"]

  nginx:
    image: nginx:alpine
    container_name: vehicle_maintenance_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - vehicle_maintenance_network
    depends_on:
      - app

volumes:
  db_data:
  node_modules:

networks:
  vehicle_maintenance_network:
    driver: bridge
